name: Cloudflare Build Check

# Runs the same build as the production Cloudflare Workers deploy
# (wrangler.production.json → `pnpm cf:ci:build`), then a Wrangler dry run
# to validate the bundle and bindings. Nothing is deployed.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm cf:ci:build

      - name: Validate Worker bundle (wrangler dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir dist-dry-run
